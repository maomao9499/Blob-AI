server:
  address: ${BLOB_SERVER_ADDRESS:127.0.0.1}
  port: ${BLOB_SERVER_PORT:8080}

spring:
  application:
    name: blob-server
  datasource:
    url: ${BLOB_DB_URL:jdbc:mysql://127.0.0.1:3306/blob_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${BLOB_DB_USERNAME:root}
    password: ${BLOB_DB_PASSWORD:}
  data:
    redis:
      host: ${BLOB_REDIS_HOST:127.0.0.1}
      port: ${BLOB_REDIS_PORT:6379}
      password: ${BLOB_REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 500ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

blob:
  upload-dir: ${BLOB_UPLOAD_DIR:../storage/images}
  desktop-token: ${BLOB_DESKTOP_TOKEN:}
  dev-origin: ${BLOB_DEV_ORIGIN:http://127.0.0.1:5173}
  allow-dev-origin: ${BLOB_ALLOW_DEV_ORIGIN:false}
